---
name: Deploy documentation

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: sphinx
        uses: sphinx-notes/pages@v3
        with:
          documentation_path: docs/source
          pyproject_group: dev
          python_version: '3.13'
          sphinx_build_options: -W
          cache: true
          publish: false
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.sphinx.outputs.artifact }}

  deploy:
    # Give the uploaded artifact time to become visible to deploy-pages.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
