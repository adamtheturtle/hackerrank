[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "setuptools-scm>=8.1.0",
]

[project]
name = "hackerrank-py"
description = "Interact with the HackerRank for Work API."
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = [
    "client",
    "hackerrank",
    "interview",
]
license = "MIT"
authors = [
    { name = "Adam Dangoor", email = "adamdangoor@gmail.com" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Web Environment",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [
    "version",
]
dependencies = [
    "beartype>=0.22.9",
    "httpx>=0.28.0",
]
optional-dependencies.dev = [
    "mypy[faster-cache]==1.20.2",
    "openapi-mock==2026.3.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.15.11",
    "sybil==10.0.1",
    "ty==0.0.32",
]
urls.Documentation = "https://adamtheturtle.github.io/hackerrank-api-python/"
urls.Source = "https://github.com/adamtheturtle/hackerrank-api-python"

[dependency-groups]
dev = []

[tool.setuptools]
zip-safe = false
package-data.hackerrank = [
    "py.typed",
]
packages.find.where = [
    "src",
]

[tool.setuptools_scm]
version_scheme = "post-release"

[tool.ruff]
line-length = 79
lint.select = [
    "ALL",
]
lint.ignore = [
    "COM812",
    "D205",
    "D212",
    "ISC001",
    "PLR0913",
]
lint.per-file-ignores."tests/*.py" = [
    "S101",
]
lint.unfixable = [
    "ERA001",
]
lint.pydocstyle.convention = "google"

[tool.mypy]
strict = true
files = [ "." ]
exclude = [ "build" ]
follow_untyped_imports = true

[tool.pyright]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = true
typeCheckingMode = "strict"

[tool.pytest]
xfail_strict = true
log_cli = true
asyncio_mode = "strict"

[tool.coverage]
run.branch = true
report.exclude_also = [
    "if TYPE_CHECKING:",
]
report.show_missing = true
